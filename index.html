        await setupVoiceAudio(rec)
        if (!alive()) { stopVoiceAudio(rec); return }
      } catch (e) {
        if (!alive()) { stopVoiceAudio(rec); return }
        cancelVoice()
        showVoiceError('Нет доступа к микрофону')
        return
      }
      rec.state = 'recording'
      renderVoice()
      acquireVoiceWakeLock(rec)
      startVoiceWave(rec)
      rec.timers.push(setTimeout(() => { if (voiceRec === rec) sendVoice() }, VOICE_MAX_RECORD_MS))
    }

    async function setupVoiceAudio(rec) {
      if (!rec.ctx) rec.ctx = new (window.AudioContext || window.webkitAudioContext)()
      const ctx = rec.ctx
      if (ctx.state === 'suspended') { try { await ctx.resume() } catch {} }
      const workletUrl = URL.createObjectURL(new Blob([PCM_WORKLET_CODE], { type: 'application/javascript' }))
      try { await ctx.audioWorklet.addModule(workletUrl) } finally { URL.revokeObjectURL(workletUrl) }
      if (voiceRec !== rec || rec.state !== 'starting' || rec.ctx !== ctx) return
      const source = ctx.createMediaStreamSource(rec.stream)
      // Полоса речи до прореживания 48→16 кГц: без фильтра всё выше 8 кГц заворачивалось бы
      // в речевой диапазон шипением, а ниже 80 Гц гудят стулья и столы.
      const highpass = ctx.createBiquadFilter()
      highpass.type = 'highpass'
      highpass.frequency.value = 80
      const lowpass = ctx.createBiquadFilter()
      lowpass.type = 'lowpass'
      lowpass.frequency.value = 7000
      rec.worklet = new AudioWorkletNode(ctx, 'pcm-processor')
      rec.worklet.port.onmessage = (e) => {
        if (voiceRec !== rec || rec.state !== 'recording') return
        const chunk = new Int16Array(e.data)
        rec.chunks.push(chunk)
        rec.samples += chunk.length
      }
      // Полоски слушают ту же полосу речи, что уходит в запись: гул стульев ниже 80 Гц их не поднимает.
      rec.analyser = ctx.createAnalyser()
      rec.analyser.fftSize = 1024
      // Тихий гейн держит граф живым (Safari иначе не обрабатывает ни воркл, ни анализатор),
      // но не выводит микрофон в динамик.
      const silent = ctx.createGain()
      silent.gain.value = 0
      source.connect(highpass)
      highpass.connect(lowpass)
      lowpass.connect(rec.worklet)
      rec.worklet.connect(silent)
      lowpass.connect(rec.analyser)
      rec.analyser.connect(silent)
      silent.connect(ctx.destination)
    }

    function hexToRgb(hex) {
      const m = /^#?([0-9a-f]{6})$/i.exec(hex || '')
      if (!m) return null
      const v = parseInt(m[1], 16)
      return [(v >> 16) & 255, (v >> 8) & 255, v & 255]
    }

    function startVoiceWave(rec) {
      if (!rec.analyser) return
      const canvas = document.getElementById('voiceWave')
      const dpr = window.devicePixelRatio || 1
      const w = canvas.clientWidth || 300
      const h = canvas.clientHeight || 40
      canvas.width = Math.round(w * dpr)
      canvas.height = Math.round(h * dpr)
      const g = canvas.getContext('2d')
      g.setTransform(dpr, 0, 0, dpr, 0, 0)
      // Цвета — из палитры сайта: графит кнопок, мятный акцент, точка между текстом и фоном.
      const css = getComputedStyle(document.documentElement)
      const cssRgb = (name, fallback) => hexToRgb(css.getPropertyValue(name).trim()) || fallback
      const muted = cssRgb('--muted', [163, 163, 163])
      const fill = cssRgb('--fill', [244, 244, 244])
      const wave = {
        g, w, h,
        ink: cssRgb('--btn-dark', [31, 31, 31]),
        mint: cssRgb('--mint-press', [72, 228, 140]),
        dot: muted.map((v, i) => Math.round((v + fill[i]) / 2))
      }
      // На одну полоску больше, чем помещается: крайняя справа въезжает, а не выскакивает.
      rec.levels = new Array(Math.ceil(w / WAVE_PITCH) + 1).fill(0)
      // Отсчёты берём дробные: у байтовых шаг 1/128, и голос в паре метров от iPhone
      // (амплитуда — сотые доли) округлялся почти в ноль. Полоски вырастали, только если
      // говорить в сам микрофон.
      const floatData = typeof rec.analyser.getFloatTimeDomainData === 'function'
      const samples = floatData ? new Float32Array(rec.analyser.fftSize) : new Uint8Array(rec.analyser.fftSize)
      // Громкость — в децибелах над фоном: голос у доски и голос у самого телефона различаются
      // по амплитуде в десятки раз, и в линейной шкале первый не был виден. Фон отслеживаем
      // (вниз быстро, вверх медленно), потолок — самое громкое за последние секунды.
      let floorDb = null
      let peakDb = -Infinity
      let lastStep = 0
      const frame = (t) => {
        if (voiceRec !== rec || rec.state !== 'recording') return
        let sum = 0
        if (floatData) {
          rec.analyser.getFloatTimeDomainData(samples)
          for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i]
        } else {
          rec.analyser.getByteTimeDomainData(samples)
          for (let i = 0; i < samples.length; i++) { const v = (samples[i] - 128) / 128; sum += v * v }
        }
        let target = 0
        // Пока микрофон просыпается, приходят ровные нули — по ним фон не считаем.
        if (sum > 0) {
          const db = 10 * Math.log10(sum / samples.length)
          // Первый звук может быть стуком по экрану — фон стартует не выше −50 дБ.
          floorDb = floorDb === null ? Math.min(db, -50) : floorDb + (db - floorDb) * (db < floorDb ? 0.1 : 0.003)
          peakDb = Math.max(db, peakDb - 0.08)
          const top = Math.max(peakDb, floorDb + WAVE_MIN_RANGE_DB)
          target = Math.min(1, Math.max(0, (db - floorDb - WAVE_GATE_DB) / (top - floorDb - WAVE_GATE_DB)))
        }
        // Полоска вырастает быстро, а опадает мягко — без дёрганья.
        rec.smooth += (target - rec.smooth) * (target > rec.smooth ? 0.55 : 0.2)
        if (!lastStep) lastStep = t
        if (t - lastStep >= WAVE_STEP_MS) {
          rec.levels.shift()
          rec.levels.push(rec.smooth)
          // После паузы вкладки не догоняем пропущенные шаги разом.
          lastStep = t - lastStep >= WAVE_STEP_MS * 2 ? t : lastStep + WAVE_STEP_MS
        }
        rec.levels[rec.levels.length - 1] = rec.smooth
        drawVoiceWave(wave, rec.levels, Math.min(1, (t - lastStep) / WAVE_STEP_MS) * WAVE_PITCH)
        rec.raf = requestAnimationFrame(frame)
      }
      drawVoiceWave(wave, rec.levels, 0)
      rec.raf = requestAnimationFrame(frame)
    }

    // Ряд полосок: новые справа, старые уходят влево. Скругление — как у кнопок сайта.
    function drawVoiceWave(wave, levels, shift) {
      const { g, w, h, ink, mint, dot } = wave
      g.clearRect(0, 0, w, h)
      const cy = h / 2
      const n = levels.length
      for (let i = 0; i < n; i++) {
        const age = n - 1 - i
        const cx = w + WAVE_PITCH / 2 - age * WAVE_PITCH - shift
        if (cx < -WAVE_PITCH || cx > w + WAVE_PITCH) continue
        const k = Math.min(1, levels[i])
        let bw = WAVE_DOT
        let bh = WAVE_DOT
        let rgb = dot
        if (k >= 0.04) {
          bw = WAVE_BAR
          bh = WAVE_DOT + (WAVE_MAX_H - WAVE_DOT) * k
          const fresh = Math.max(0, 1 - age / WAVE_HEAD)
          rgb = ink.map((v, j) => Math.round(v + (mint[j] - v) * fresh))
        }
        g.globalAlpha = Math.max(0, Math.min(1, cx / (WAVE_PITCH * 6)))
        g.fillStyle = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`
        const x = cx - bw / 2
        const y = cy - bh / 2
        const r = Math.min(1.5, bw / 2)
        g.beginPath()
        g.moveTo(x + r, y)
        g.lineTo(x + bw - r, y)
        g.quadraticCurveTo(x + bw, y, x + bw, y + r)
        g.lineTo(x + bw, y + bh - r)
        g.quadraticCurveTo(x + bw, y + bh, x + bw - r, y + bh)
        g.lineTo(x + r, y + bh)
        g.quadraticCurveTo(x, y + bh, x, y + bh - r)
        g.lineTo(x, y + r)
        g.quadraticCurveTo(x, y, x + r, y)
        g.closePath()
        g.fill()
      }
      g.globalAlpha = 1
    }

    function stopVoiceAudio(rec) {
      if (rec.raf) { cancelAnimationFrame(rec.raf); rec.raf = 0 }
      if (rec.worklet) { try { rec.worklet.port.onmessage = null; rec.worklet.disconnect() } catch {}; rec.worklet = null }
      if (rec.ctx) {
        try { const closing = rec.ctx.close(); if (closing && closing.catch) closing.catch(() => {}) } catch {}
        rec.ctx = null
      }
      if (rec.stream) { rec.stream.getTracks().forEach(t => t.stop()); rec.stream = null }
      if (rec.wakeLock) { try { rec.wakeLock.release() } catch {}; rec.wakeLock = null }
    }

    function clearVoiceTimers(rec) {
      rec.timers.forEach(clearTimeout)
      rec.timers = []
    }

    // ■ и уход с истории: запись выбрасывается, ничего не отправляется.
    function cancelVoice() {
      const rec = voiceRec
      if (!rec) return
      voiceRec = null
      stopVoiceAudio(rec)
      clearVoiceTimers(rec)
      rec.chunks = []
      renderVoice()
    }

    // ↑, предел длительности и сворачивание приложения: панель закрывается сразу,
    // расшифровка и ответ идут в фоне.
    function sendVoice() {
      const rec = voiceRec
      if (!rec || rec.state !== 'recording') return
      voiceRec = null
      stopVoiceAudio(rec)
      clearVoiceTimers(rec)
      renderVoice()
      if (voiceDurationMs(rec) < VOICE_MIN_RECORD_MS) return
      processVoice(rec.chunks, currentSubject)
    }

    async function processVoice(chunks, subject) {
      // Сначала даём экрану закрыть панель, потом собираем WAV: на длинной записи это
      // заметная доля секунды.
      await new Promise(resolve => setTimeout(resolve, 0))
      const transcript = await transcribeVoice(arrayBufferToBase64(buildWav(chunks, VOICE_SAMPLE_RATE)))
      if (!transcript.ok) { showVoiceError('Не удалось расшифровать: ' + transcript.error); return }
      const question = transcript.text
      if (!question) { showVoiceError('Ничего не распознано — попробуй ещё раз'); return }
      const historyBlock = conversationHistory.length
        ? 'Предыдущие вопросы и ответы (используй, если текущий вопрос — уточнение вроде «а почему?»):\n' +
          conversationHistory.map((h, i) => `${i + 1}. Вопрос: ${h.q}\n   Ответ: ${h.a}`).join('\n') + '\n\n'
        : ''
      let result
      try {
        result = await callPolza({
          // Основная модель без рассуждений (minimal). Проверено на Gemini 3.8 Flash: «988 год,
          // Владимир Святославич (Владимир Великий)» за 3,4 с, 0 токенов на рассуждения, 0,02 ₽.
          model: MODEL_FAST,
          max_tokens: 400,
          ...modelParams(MODEL_FAST, 'minimal'),
          messages: [{ role: 'user', content: [{ type: 'text', text: VOICE_QUESTION_PROMPT + historyBlock + 'Вопрос: ' + question }] }]
        }, 20000)
      } catch (e) {
        result = { ok: false, error: e && e.message }
      }
      const answer = result && result.ok && result.answer ? String(result.answer).trim() : ''
      if (!answer) { showVoiceError('Не удалось получить ответ: ' + ((result && result.error) || 'пустой ответ')); return }
      conversationHistory.push({ q: question, a: answer })
      if (conversationHistory.length > HISTORY_MAX) conversationHistory.shift()
      finalizeVoiceAnswer(answer, question, subject)
    }

    function voiceLeftAction() {
      cancelVoice()
    }

    function voiceRightAction() {
      sendVoice()
    }

    function finalizeVoiceAnswer(answer, heard, subject) {
      sendVoiceToWatch(answer)
      // Пока ждали ответ, могли переключить предмет: карточку в чужой список не кладём,
      // на часы ответ всё равно ушёл.
      if (subject !== currentSubject) return
      lastVoiceAnswer = answer
      lastAnswer = answer
      hide('errorCard')
      hide('resultCard')
      hide('resultHeader')
      const list = document.getElementById('tasksList')
      const card = document.createElement('div')
      card.className = 'task-card'
      // Над ответом — распознанный вопрос: в потоке карточек иначе не понять, к чему ответ.
      card.innerHTML = `<div class="heard">${heard.replace(/</g, '&lt;')}</div><div class="task-text">${answer.replace(/</g, '&lt;')}</div>`
      list.insertBefore(card, list.firstChild)
      list.style.display = 'flex'
    }

    // Свернули приложение посреди записи — iPhone всё равно отбирает микрофон в фоне.
    // Отправляем то, что успели сказать.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && voiceRec && voiceRec.state === 'recording') sendVoice()
    })

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const img = new Image()
        const url = URL.createObjectURL(file)
        const release = () => { img.onload = img.onerror = null; URL.revokeObjectURL(url) }
        img.onload = () => {
          try {
            // 2400, а не 1600: мелкие дроби вроде ⅔x на снимке листка при 1600 выходят в несколько
            // пикселей, и модель гадает. Больше — тяжелее отправка и дороже картинка у Opus.
            const MAX = 2400
            let w = img.width, h = img.height
            if (w > MAX || h > MAX) {
              if (w > h) { h = Math.round(h * MAX / w); w = MAX }
              else { w = Math.round(w * MAX / h); h = MAX }
            }
            const c = document.createElement('canvas')
            c.width = w; c.height = h
            c.getContext('2d').drawImage(img, 0, 0, w, h)
            const data = c.toDataURL('image/jpeg', 0.80).split(',')[1]
            // Safari держит память холста, пока у него есть размер, — отдаём её сразу,
            // иначе к третьему-четвёртому листу упираемся в его лимит памяти холстов.
            c.width = 0; c.height = 0
            release()
            resolve(data)
          } catch (e) {
            release()
            reject(new Error('Не удалось обработать снимок'))
          }
        }
        img.onerror = () => { release(); reject(new Error('Не удалось прочитать файл')) }
        img.src = url
      })
    }

    // Листы сжимаем по одному, а не все разом: в памяти одновременно только один
    // декодированный снимок.
    async function filesToBase64(files) {
      const out = []
      for (const file of files) out.push(await toBase64(file))
      return out
    }

    function show(id)  { document.getElementById(id).style.display = 'flex' }
    function hide(id)  { document.getElementById(id).style.display = 'none' }
    function block(id) { document.getElementById(id).style.display = 'block' }
    function setText(id, text) { document.getElementById(id).textContent = text }

    let lastAnswer = ''
    let lastTasks = []
    let lastPhotoUrl = null
    let sendQueue = null

    // Метка TASKS:n — служебная, нужна только разбивке. На экран и на часы она
    // попадать не должна: при одном задании она уезжала прямо в текст ответа.
    // Модель пишет её и как TASKS:[6] — буквально по шаблону из промпта, — и с пробелом.
    const stripTasksMarker = (t) => String(t).replace(/^\s*TASKS:\s*\[?\s*\d+\s*\]?\s*/i, '').trim()

    function splitTasks(text) {
      const countMatch = text.match(/TASKS:\s*\[?\s*(\d+)\s*\]?/i)
      // Модель, несмотря на запрет, иногда оформляет номера markdown-разметкой:
      // «**1.**», «* 1)», «### 1.». Тогда строка перестаёт начинаться с цифры,
      // разбивка по номерам не срабатывает, и весь разбор приезжает одной карточкой.
      // Поэтому разметку снимаем до разбора. Минус в начале строки не трогаем — это
      // может быть знак отрицательного ответа.
      const clean = text
        .replace(/TASKS:\s*\[?\s*\d+\s*\]?/i, '')
        .replace(/\r\n/g, '\n')
        .replace(/\*\*|__/g, '')
        .replace(/^[ \t]*[*#>]+[ \t]*/gm, '')
        .trim()
      const parts = clean.split(/\n[ \t]*\n+/).map(p => p.trim()).filter(Boolean)
      // Номер в начале строки: «3.», «3)», «3 », у пунктов — «3а.», «3б)». Буква допускается
      // только перед точкой или скобкой, иначе строка решения «3x = 21» резалась бы как задача.
      const byNumber = () => clean.split(/^(?=\d{1,2}(?:[а-яa-z][.)]|[.) ]))/m).map(p => p.trim()).filter(Boolean)
      let tasks
      if (countMatch) {
        const n = parseInt(countMatch[1])
        if (parts.length === n) tasks = parts
        else {
          const numbered = byNumber()
          tasks = numbered.length === n ? numbered : (parts.length > 1 ? parts : [clean])
        }
      } else if (parts.length > 1) {
        tasks = parts
      } else {
        const numbered = byNumber()
        tasks = numbered.length > 1 ? numbered : [clean]
      }
      return tasks.flatMap(splitSubItems)
    }

    // Пункты а), б), в) одной задачи — отдельные задания: у каждого своё решение, свой ответ
    // и своя отправка на часы. Модель просят писать их отдельно; если она всё же свела пункты
    // в один блок, режем здесь. Общее условие до первого пункта остаётся у первого пункта.
    function splitSubItems(task) {
      const lines = task.split('\n')
      const starts = []
      lines.forEach((line, i) => {
        const m = /^\s*([а-еa-e])\s*[).](?:\s+\S|\s*$)/i.exec(line)
        if (!m) return
        const letter = m[1].toLowerCase()
        const order = 'абвгде'.includes(letter) ? 'абвгде'.indexOf(letter) : 'abcde'.indexOf(letter)
        if (order === starts.length) starts.push({ line: i, letter })
      })
      if (starts.length < 2) return [task]
      const head = lines.slice(0, starts[0].line).filter(l => l.trim())
      const numMatch = head.length ? /^\s*(\d{1,2})\s*[.)]\s*/.exec(head[0]) : null
      if (numMatch) {
        const rest = head[0].slice(numMatch[0].length).trim()
        if (rest) head[0] = rest
        else head.shift()
      }
      const num = numMatch ? numMatch[1] : ''
      return starts.map((s, k) => {
        const end = k + 1 < starts.length ? starts[k + 1].line : lines.length
        const body = lines.slice(s.line, end)
        body[0] = body[0].replace(/^\s*[а-еa-e]\s*[).]\s*/i, '')
        if (!body[0].trim()) body.shift()
        const label = num ? num + s.letter + '.' : s.letter + ')'
        return [label, ...(k === 0 ? head : []), ...body].join('\n').trim()
      })
    }

    // Строка номера в начале задания: «1.», «1)», «1а.», «1 а)», «1(а)». Точка или скобка должна
    // стоять перед пробелом или концом строки — «1.5 см» и «3x = 21» номером не считаются.
    const TASK_NUMBER_RE = /^\s*(\d{1,2})\s*(?:([а-яa-z])\s*[.)]|\(([а-яa-z])\)\s*[.)]?|[.)])(?=[ \t]|\n|$)/i

    // Подпись задания — номер из ответа модели: «1», «3а». Нет номера — по порядку.
    function taskLabel(task, i) {
      const m = TASK_NUMBER_RE.exec(String(task))
      if (!m) return String(i + 1)
      const letter = m[2] || m[3]
      return m[1] + (letter ? letter.toLowerCase() : '')
    }

    // «3а» → «3 (а)» с серой буквой: так подписаны кнопки и карточки.
    function taskLabelHtml(label) {
      const m = /^(\d{1,2})([а-яa-z])$/i.exec(label)
      return m ? `${m[1]} <span class="task-sub">(${m[2]})</span>` : label
    }

    // «3 (а)» — та же подпись простым текстом, для заголовка уведомления.
    function taskLabelText(label) {
      const m = /^(\d{1,2})([а-яa-z])$/i.exec(label)
      return m ? `${m[1]} (${m[2]})` : label
    }

    // Текст задания без строки номера. Номер модель пишет, чтобы приложение разбило ответ
    // и подписало кнопки, а на карточке и на часах он лишний: подпись там уже есть.
    function taskBody(task) {
      const text = String(task)
      const m = TASK_NUMBER_RE.exec(text)
      if (!m) return text.trim()
      return text.slice(m[0].length).replace(/^[ \t]*\n?/, '').trim()
    }

    // Результаты живут отдельно для каждого предмета. Область ответа одна на всё
    // приложение, поэтому при переключении снимаем её состояние для старого предмета
    // и возвращаем сохранённое для нового — разбор алгебры больше не пропадает
    // из-за того, что следом сфотографировали геометрию.
    const SUBJECT_VIEW_NODES = [
      ['tasksList', true], ['taskBtnsBar', true], ['resultCard', true], ['errorCard', true],
      ['tasksHeader', false], ['resultHeader', false], ['resultResendBtn', false], ['halfBtns', false],
      ['shootBtn', false], ['galleryBtn', false], ['againBtn', false], ['galleryBtn2', false], ['savePhotoBtn', false]
    ]
    const subjectViews = {}
    let pristineView = null

    function captureSubjectView() {
      const nodes = {}
      SUBJECT_VIEW_NODES.forEach(([id, withHtml]) => {
        const el = document.getElementById(id)
        if (el) nodes[id] = { display: el.style.display, html: withHtml ? el.innerHTML : null }
      })
      return {
        nodes, answer: lastAnswer, voiceAnswer: lastVoiceAnswer,
        tasks: lastTasks.slice(), nextIdx: nextTaskIdx, photoUrl: lastPhotoUrl, files: lastFiles
      }
    }

    function restoreSubjectView(snap) {
      if (!snap) return
      SUBJECT_VIEW_NODES.forEach(([id, withHtml]) => {
        const el = document.getElementById(id)
        const saved = snap.nodes[id]
        if (!el || !saved) return
        if (withHtml && saved.html !== null) el.innerHTML = saved.html
        el.style.display = saved.display
      })
      lastAnswer = snap.answer
      lastVoiceAnswer = snap.voiceAnswer
      lastTasks = snap.tasks.slice()
      nextTaskIdx = snap.nextIdx
      lastPhotoUrl = snap.photoUrl
      lastFiles = snap.files
      // Кнопки задач создаются кодом, а не разметкой, поэтому обработчики на них
      // не переживают восстановление html — вешаем заново.
      lastTasks.forEach((task, i) => {
        const btn = document.getElementById('task-btn-' + i)
        if (!btn) return
        // Очередь при уходе с предмета остановлена: «отправляется» на кнопке остаться не должно.
        if (btn.dataset.state === 'sending') delete btn.dataset.state
        btn.onclick = () => autoSendAllTasks(lastTasks, i)
      })
    }

    function switchSubject(value) {
      if (value === currentSubject) return
      // Очередь автоотправки принадлежала прежнему предмету: её задачи уже заменены
      // в lastTasks, и продолжение слало бы на часы чужие ответы.
      stopTaskQueue()
      // Вторая половина ответа тоже принадлежала прежнему предмету.
      stopHalves()
      // Заготовки ожидания принадлежат запросу, а не предмету: на другом экране им не место.
      hide('loadingCards')
      subjectViews[currentSubject] = captureSubjectView()
      currentSubject = value
      restoreSubjectView(subjectViews[value] || pristineView)
      updateVoiceBtn()
      autoModelForSubject()
    }

    // keepStates — список дописывается по ходу ответа: отметки «отправляется/отправлено»
    // на уже показанных кнопках сохраняем.
    function renderTasks(tasks, keepStates) {
      const list = document.getElementById('tasksList')
      const header = document.getElementById('tasksHeader')
      const bar = document.getElementById('taskBtnsBar')
      const states = keepStates ? Array.from(bar.children, b => b.dataset.state) : []
      list.innerHTML = ''
      bar.innerHTML = ''
      const total = tasks.length
      tasks.forEach((task, i) => {
        const card = document.createElement('div')
        card.className = 'task-card'
        const label = taskLabel(task, i)
        card.innerHTML = `
          <div class="task-num">№${taskLabelHtml(label)}</div>
          <div class="task-text">${taskBody(task).replace(/</g, '&lt;')}</div>
        `
        list.appendChild(card)
        const btn = document.createElement('button')
        btn.id = `task-btn-${i}`
        btn.innerHTML = taskLabelHtml(label)
        // Размер и цвета — в CSS (.seat-grid, .task-btn): сетка держит ячейку не уже 44px,
        // иначе при двадцати заданиях в кнопку было не попасть пальцем.
        btn.className = 'task-btn'
        if (states[i]) btn.dataset.state = states[i]
        // Не одиночная отправка, а перезапуск очереди с этого номера: нажал «4» —
        // ушло четвёртое, дальше пятое, шестое, а прежняя очередь остановлена.
        btn.onclick = () => autoSendAllTasks(lastTasks, i)
        bar.appendChild(btn)
      })
      header.style.display = total > 0 ? 'block' : 'none'
      list.style.display = 'flex'
    }

    // ===== Очередь заданий на часы =====
    // Задания уходят строго по очереди, с первого по последнее: части одного задания — с паузой
    // 30 с, между заданиями — 2 минуты, после последнего очередь останавливается сама.
    // Короткие ответы без решения («135», «расположенный»), идущие подряд, уходят одним
    // сообщением списком: по одному раз в две минуты четыре ответа русского шли бы шесть минут.
    // Следующий шаг заводится только после предыдущего: если iPhone приостановил страницу,
    // после возврата части не вываливаются пачкой, а идут дальше с тем же шагом.
    const PART_GAP_MS = 30 * 1000
    const TASK_GAP_MS = 2 * 60 * 1000
    const SHORT_TASK_MAX = 40
    let autoSendCancel = null
    let sendWakeLock = null

    function setTaskBtnState(idx, state) {
      const btn = document.getElementById(`task-btn-${idx}`)
      if (!btn) return
      if (state) btn.dataset.state = state
      else delete btn.dataset.state
    }

    // Пока идёт очередь, экран не гаснет: на заблокированном iPhone страница засыпает,
    // и следующие части не ушли бы до разблокировки.
    async function holdSendWakeLock() {
      if (sendWakeLock || !autoSendCancel || !navigator.wakeLock) return
      try {
        const lock = await navigator.wakeLock.request('screen')
        if (autoSendCancel && !sendWakeLock) sendWakeLock = lock
        else lock.release()
      } catch {}
    }

    function releaseSendWakeLock() {
      if (sendWakeLock) { try { sendWakeLock.release() } catch {}; sendWakeLock = null }
    }

    // Когда приложение свёрнуто, система сама отпускает блокировку экрана — берём её заново,
    // как только вернулись, если очередь ещё идёт.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || !autoSendCancel) return
      sendWakeLock = null
      holdSendWakeLock()
    })

    // purge — убрать из очереди показа ещё не показанные части этой очереди. При остановке
    // (номер, «Заново», смена предмета) — да, а когда очередь дошла до конца — нет: последняя
    // часть может ждать своих четырёх секунд за ответом голосом.
    function stopTaskQueue(purge = true) {
      if (sendQueue) { clearTimeout(sendQueue); sendQueue = null }
      if (purge && autoSendCancel) purgeWatchOutbox(autoSendCancel)
      autoSendCancel = null
      releaseSendWakeLock()
    }

    function isShortTask(task) {
      const body = taskBody(task)
      return body.length > 0 && body.length <= SHORT_TASK_MAX && !body.includes('\n')
    }

    // Что уходит одним сообщением: одно задание или подряд идущие короткие ответы.
    function watchUnit(tasks, from) {
      let to = from
      if (isShortTask(tasks[from])) while (to + 1 < tasks.length && isShortTask(tasks[to + 1])) to++
      const labels = []
      for (let i = from; i <= to; i++) labels.push(taskLabelText(taskLabel(tasks[i], i)))
      const text = from === to
        ? taskBody(tasks[from])
        : tasks.slice(from, to + 1).map((t, k) => `${labels[k]}. ${taskBody(t)}`).join('\n')
      const name = from === to ? `№${labels[0]}` : `№${labels[0]}-${labels[labels.length - 1]}`
      return { from, to, name, parts: watchChunks(text) }
    }

    // startIdx — с какого задания начать. Номер задачи, «Отправить все» и двойное касание
    // перезапускают очередь; прежняя останавливается целиком, вместе с частями, которые
    // ещё не ушли. Пока ответ модели дописывается (liveAnswer), список растёт на ходу: дойдя
    // до конца известных заданий, очередь ждёт следующее, а не останавливается.
    function autoSendAllTasks(tasks, startIdx) {
      stopTaskQueue()
      if (!tasks || !tasks.length) return
      const token = {}
      autoSendCancel = token
      const growing = () => !!(liveAnswer && liveAnswer.live && liveAnswer.tasks === tasks)
      let taskIdx = Math.min(Math.max(Number(startIdx) || 0, 0), tasks.length - 1)
      // С выбранного номера и дальше отметки снимаются; отправленные раньше остаются.
      for (let i = 0; i < tasks.length; i++) {
        const btn = document.getElementById(`task-btn-${i}`)
        if (btn && (i >= taskIdx || btn.dataset.state === 'sending')) delete btn.dataset.state
      }
      holdSendWakeLock()
      let unit = null
      let partIdx = 0
      const mark = (state) => { for (let i = unit.from; i <= unit.to; i++) setTaskBtnState(i, state) }
      const step = () => {
        sendQueue = null
        if (token !== autoSendCancel) return
        if (!unit) {
          if (taskIdx >= tasks.length) {
            // Ответ ещё дописывается: следующее задание вот-вот появится.
            if (growing()) { sendQueue = setTimeout(step, 1000); return }
            stopTaskQueue(false)
            return
          }
          unit = watchUnit(tasks, taskIdx)
          partIdx = 0
          nextTaskIdx = taskIdx
          mark('sending')
        }
        if (partIdx < unit.parts.length) {
          // Уведомления выключены — помечаем задание и останавливаемся, а не делаем вид,
          // что всё ушло.
          if (!showWatchNotification(watchTitle(unit.name, partIdx, unit.parts.length), unit.parts[partIdx], token)) {
            mark('error')
            stopTaskQueue()
            return
          }
          partIdx++
          if (partIdx < unit.parts.length) { sendQueue = setTimeout(step, PART_GAP_MS); return }
        }
        mark('done')
        taskIdx = unit.to + 1
        unit = null
        nextTaskIdx = taskIdx
        if (taskIdx < tasks.length || growing()) { sendQueue = setTimeout(step, TASK_GAP_MS); return }
        stopTaskQueue(false)
      }
      step()
    }

    // ===== Задания по мере готовности =====
    // Модель пишет ответ потоком. Задание готово, как только за ним начался номер следующего:
    // его сразу показываем, а первое ещё и отправляем на часы. Замер на листке из шести задач:
    // первое задание готово через 4–6 с, весь ответ — через 9–10 с; на странице задачника
    // из 32 задач — через 9 с и 47 с. Последнее задание и одиночный ответ ждут конца ответа.
    // Сплошные предметы и короткие ответы (русский) — тоже: они уходят целиком или списком,
    // а приходят и так за секунды.
    let liveAnswer = null
    const NEXT_TASK_START = /\n[ \t]*\n[ \t]*(?:\*\*|#+[ \t]*)?\d{1,2}[ \t]*(?:[а-яa-z][ \t]*)?[.)](?=\s)/gi

    // Готовые задания из недописанного ответа: всё, после чего уже начался номер следующего.
    // Кусок между началами соседних номеров — ровно одно задание, поэтому не splitTasks: у куска
    // без метки TASKS там включается разбивка по номерам строк, и строки решения вроде
    // «17 · 24 = 408» становились отдельными заданиями. Чистка — та же, что в splitTasks.
    function readyTasks(text) {
      const body = String(text).replace(/FIGURE_JSON:[\s\S]*$/, '')
      const tasks = []
      let from = 0
      for (const m of body.matchAll(NEXT_TASK_START)) {
        const task = stripTasksMarker(body.slice(from, m.index))
          .replace(/\r\n/g, '\n')
          .replace(/\*\*|__/g, '')
          .replace(/^[ \t]*[*#>]+[ \t]*/gm, '')
          .trim()
        if (task) tasks.push(...splitSubItems(task))
        from = m.index
      }
      return tasks
    }

    function startEarlyTasks(subject) {
      if (SINGLE_BLOCK_SUBJECTS.includes(subject)) return null
      const early = { tasks: [], started: false, live: true }
      early.onText = (text) => {
        if (!early.live || currentSubject !== subject) return
        const tasks = readyTasks(text)
        if (tasks.length <= early.tasks.length) return
        if (!early.started && isShortTask(tasks[0])) return
        early.tasks.splice(0, early.tasks.length, ...tasks)
        lastTasks = early.tasks
        if (!early.started) {
          hide('resultCard'); hide('resultHeader'); document.getElementById('resultResendBtn').style.display = 'none'
          hide('errorCard')
          hide('loadingCards')
        }
        renderTasks(early.tasks, early.started)
        if (!early.started) {
          early.started = true
          liveAnswer = early
          autoSendAllTasks(early.tasks)
        }
      }
      return early
    }

    // Готовый ответ — на экран и на часы. Если задания уже показывались по ходу потока, очередь
    // идёт: полный ответ только уточняет список, не перезапуская отправку.
    function showPhotoAnswer(data, early) {
      hide('loadingCards')
      const displayAnswer = currentSubject === 'geometry' ? parseAndRenderGeometry(data.answer) : (renderFigure(null), data.answer)
      lastAnswer = stripTasksMarker(displayAnswer)
      const tasks = splitTasks(displayAnswer)
      if (early && early.started) {
        early.tasks.splice(0, early.tasks.length, ...tasks)
        lastTasks = early.tasks
        renderTasks(lastTasks, true)
        return
      }
      lastTasks = tasks
      nextTaskIdx = 0
      if (lastTasks.length > 1 && !SINGLE_BLOCK_SUBJECTS.includes(currentSubject)) {
        hide('resultCard'); hide('resultHeader'); document.getElementById('resultResendBtn').style.display = 'none'
        renderTasks(lastTasks)
        autoSendAllTasks(lastTasks)
      } else {
        document.getElementById('tasksList').style.display = 'none'
        // Одно задание: строка номера на карточке тоже лишняя. В сплошных предметах текст как есть —
        // там «1. ответ» на каждой строке и есть сам ответ.
        setText('resultText', SINGLE_BLOCK_SUBJECTS.includes(currentSubject) ? lastAnswer : taskBody(lastAnswer))
        document.getElementById('resultHeader').style.display = 'block'
        document.getElementById('resultResendBtn').style.display = 'block'
        document.getElementById('resultCost').textContent = ''
        block('resultCard')
        notifyAnswer(lastAnswer)
      }
    }

    let lastFiles = []

    async function regenerate() {
      if (!lastFiles.length) return
      stopTaskQueue()
      hide('resultCard'); hide('resultHeader'); document.getElementById('resultResendBtn').style.display = 'none'
      hide('errorCard')
      document.getElementById('tasksList').style.display = 'none'
      document.getElementById('tasksHeader').style.display = 'none'
      show('loadingCards')
      let early = null
      try {
        const images = await filesToBase64(lastFiles)
        early = startEarlyTasks(currentSubject)
        const data = await analyzePhotos(images, early && early.onText)
        if (!data.ok || !data.answer) throw new Error(data.error || 'Пустой ответ')
        showPhotoAnswer(data, early)
        document.getElementById('savePhotoBtn').style.display = 'block'
      } catch(e) {
        setText('errorText', e.message || 'Ошибка')
        block('errorCard')
      }
      hide('loadingCards')
      if (early) early.live = false
    }

    let nextTaskIdx = 0
    async function resendToWatch() {
      if (!lastAnswer) return
      const btn = document.getElementById('resultResendBtn')
      btn.textContent = 'Отправляю...'
      btn.disabled = true
      try {
        notifyAnswer(lastAnswer)
        btn.textContent = 'Отправлено!'
        setTimeout(() => { btn.textContent = 'Отправить'; btn.disabled = false }, 2000)
      } catch(e) {
        btn.textContent = 'Ошибка'; btn.disabled = false
      }
    }

    // ===== Съёмка нескольких листов =====
    // Системная камера отдаёт по одному снимку за раз, поэтому копим их сами:
    // нажал «3» — снимаешь три листа подряд, и только потом всё уходит в модель
    // одним запросом.
    //
    // Под iPhone здесь три правила:
    // 1. Safari открывает камеру только по прямому нажатию. Вызов из обработчика
    //    готового снимка он молча игнорирует, поэтому между листами на весь экран
    //    встаёт заставка: нажатие в любом её месте и есть нужное нажатие.
    // 2. Снимок из input нельзя откладывать: после сброса value и повторного открытия
    //    камеры прежний файл на iPhone становится нечитаемым. Байты копируем сразу.
    // 3. Сжимаем листы строго по одному (filesToBase64): несколько декодированных
    //    снимков по 12 Мп разом Safari не вытягивает и перезагружает страницу.
    let shotsNeeded = 1
    let shotsCollected = []
    let shotReading = false

    function startShooting(n) {
      if (shotReading) return
      shotsNeeded = n
      shotsCollected = []
      // Кнопки листов видны и после разбора, когда основная кнопка спрятана. Начали
      // новую серию — возвращаем её на экран, иначе номер снимка показывать негде.
      document.getElementById('shootBtn').style.display = 'flex'
      hide('againBtn')
      updateShootButton()
      document.getElementById('camera').click()
    }

    function shootButtonAction() {
      if (shotReading) return
      // Дожимаем начатую серию, если она не закончена, иначе начинаем новую с одного листа.
      if (shotsCollected.length && shotsCollected.length < shotsNeeded) {
        document.getElementById('camera').click()
      } else {
        startShooting(1)
      }
    }

    // Нажатие на заставку между листами.
    function continueShooting() {
      if (shotReading) return
      document.getElementById('camera').click()
    }

    function cancelShooting() {
      shotsNeeded = 1
      shotsCollected = []
      updateShootButton()
    }

    function updateShootButton() {
      const btn = document.getElementById('shootBtn')
      const pending = shotsNeeded > 1 && shotsCollected.length > 0 && shotsCollected.length < shotsNeeded
      btn.textContent = pending ? `Снимок ${shotsCollected.length + 1} из ${shotsNeeded}` : 'Фото'
      if (pending) btn.dataset.state = 'series'
      else delete btn.dataset.state
      document.getElementById('shotOverlay').classList.toggle('open', pending)
      if (pending) {
        setText('shotCount', `${shotsCollected.length + 1} из ${shotsNeeded}`)
        setText('shotHint', `Снято листов: ${shotsCollected.length}. Нажми в любом месте, чтобы снять следующий`)
      }
    }

    // Копия снимка в памяти, не зависящая от input (правило 2).
    async function detachFile(file) {
      const buf = typeof file.arrayBuffer === 'function'
        ? await file.arrayBuffer()
        : await new Promise((resolve, reject) => {
            const reader = new FileReader()
            reader.onload = () => resolve(reader.result)
            reader.onerror = () => reject(reader.error || new Error('read failed'))
            reader.readAsArrayBuffer(file)
          })
      return new Blob([buf], { type: file.type || 'image/jpeg' })
    }

    async function onPhotoInput(input) {
      const picked = Array.from(input.files || [])
      if (!picked.length) { input.value = ''; return }
      shotReading = true
      let files = []
      try {
        for (const file of picked) files.push(await detachFile(file))
      } catch (e) {
        files = null
      } finally {
        shotReading = false
        // Сбрасываем только после копии. Сброс нужен: без него повторный выбор того же
        // файла из галереи не даёт события change.
        input.value = ''
      }
      if (!files) {
        if (document.getElementById('shotOverlay').classList.contains('open')) {
          setText('shotHint', 'Снимок не прочитался. Нажми, чтобы снять этот лист ещё раз')
        } else {
          setText('errorText', 'Не удалось прочитать снимок — сними ещё раз')
          block('errorCard')
        }
        return
      }
      // Галерея отдаёт нужное количество файлов сразу — счётчик листов ей не нужен.
      if (input.id === 'gallery') {
        shotsNeeded = 1
        shotsCollected = []
        updateShootButton()
        handlePhoto({ files })
        return
      }
      shotsCollected.push(files[0])
      if (shotsCollected.length < shotsNeeded) {
        updateShootButton()
        return
      }
      const all = shotsCollected
      shotsNeeded = 1
      shotsCollected = []
      updateShootButton()
      handlePhoto({ files: all })
    }

    async function handlePhoto(input) {
      const files = Array.from(input.files)
      if (!files.length) return

      lastFiles = files
      lastPhotoUrl = URL.createObjectURL(files[0])

      hide('shootBtn')
      hide('galleryBtn')
      document.getElementById('againBtn').style.display = 'flex'
      block('galleryBtn2')
      hide('resultCard'); hide('resultHeader'); document.getElementById('resultResendBtn').style.display = 'none'
      hide('errorCard')
      // Пока модель думает — заготовки карточек; прежний ответ убираем, чтобы не спутать его с новым.
      hide('tasksList'); hide('tasksHeader')
      show('loadingCards')
      document.getElementById('savePhotoBtn').style.display = 'block'

      let wakeLock = null
      try { wakeLock = await navigator.wakeLock.request('screen') } catch {}

      let early = null
      try {
        // Сжатие внутри try: если лист не прочитался, раньше ошибка улетала мимо
        // и загрузка крутилась бесконечно.
        const images = await filesToBase64(files)
        early = startEarlyTasks(currentSubject)
        const data = await analyzePhotos(images, early && early.onText)
        if (!data.ok || !data.answer) throw new Error(data.error || 'Пустой ответ')
        showPhotoAnswer(data, early)
        document.getElementById('savePhotoBtn').style.display = 'block'
      } catch (e) {
        setText('errorText', e.message || 'Не удалось подключиться к серверу')
        block('errorCard')
      }
      hide('loadingCards')
      // Ответ закончен или не пришёл: очередь больше не ждёт новых заданий.
      if (early) early.live = false
      if (wakeLock) try { wakeLock.release() } catch {}
    }
  </script>


</body>
</html>
