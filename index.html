<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --font-d: 'Unbounded', sans-serif;
      --font: 'Manrope', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }

    body {
      background: #F5F6FA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 40px;
      color: #111;
    }

    header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 20px;
    }

    .logo { font-size: 20px; font-weight: 800; color: #111; letter-spacing: -0.5px; font-family: var(--font-d); }
    
    .settings-icon {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #EAEAF2;
      color: #7B61FF;
      cursor: pointer;
    }


    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 10px;
      border: 1px solid #EAEAF2;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }



    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-primary { background: #7B61FF; color: #fff; }
    .btn-secondary { background: #F0EDFF; color: #7B61FF; display: block; }

    .status {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 30px 20px;
      width: 100%;
      max-width: 400px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #EAEAF2;
      border-top-color: #7B61FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { display: none; }

    .result-card {
      display: none;
      background: #fff;
      border-radius: 16px;
      padding: 16px 16px 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      border: 1px solid #EAEAF2;
      position: relative;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .result-label {
      font-size: 13px;
      font-weight: 700;
      color: #7B61FF;
    }
    
    .result-cost {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
      text-align: right;
    }
    .result-text {
      font-size: 15px;
      line-height: 1.6;
      color: #111;
      white-space: pre-wrap;
    }

    .tasks-list { display:none; flex-direction:column; gap:12px; width:100%; max-width:400px; margin-top:10px; }
    .task-card {
      background:#fff;
      border-radius:16px;
      padding:16px 16px 12px;
      border:1px solid #EAEAF2;
      position:relative;
      box-shadow:0 4px 16px rgba(0,0,0,0.03);
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .task-num {
      font-size:13px;
      font-weight:700;
      color:#7B61FF;
    }
    .task-text {
      font-size:15px;
      line-height:1.6;
      color:#111;
      white-space:pre-wrap;
    }

    .error-card {
      display: none;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #FFEEEE;
      margin-top: 10px;
    }
    .error-text { font-size: 14px; color: #FF453A; line-height: 1.5; font-weight: 500; }


    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 28px 20px 40px;
      width: 100%;
      max-width: 400px;
    }
    .modal-title { font-size: 18px; font-weight: 800; font-family: var(--font-d); margin-bottom: 20px; }
    .modal-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #EAEAF2; font-size: 15px; }
    .modal-row:last-child { border-bottom: none; }
    .modal-val { color: #7B61FF; font-weight: 600; }
    .modal-close { width: 100%; padding: 14px; background: #F0EDFF; color: #7B61FF; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 20px; font-family: var(--font); }

    #photoScreen { display:flex; flex-direction:column; align-items:center; width:100%; }
  </style>

}' style="padding:9px 12px;border-radius:8px;border:1px solid #EAEAF2;background:#F8F9FB;color:#111;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;width:100%;box-sizing:border-box;resize:vertical"></textarea>
        <button onclick="saveApiKeys()" style="padding:9px 18px;border-radius:8px;border:none;background:#F0EDFF;color:#7B61FF;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font)">Сохранить ключи</button>

  <script>
    // Бекэнда больше нет: страница ходит в Polza и Google сама. Ключи поэтому лежат
    // только в localStorage этого устройства — в исходнике страницы их нет, и публичный
    // репозиторий на GitHub Pages не выдаёт ничего, что можно было бы утащить сканером.
    const KEYS_STORAGE = 'tutorApiKeys'
    let apiKeys = { polza: '', google: '' }

    function loadApiKeys() {
      try {
        const saved = JSON.parse(localStorage.getItem(KEYS_STORAGE) || '{}')
        apiKeys = { polza: saved.polza || '', google: saved.google || '' }
      } catch { apiKeys = { polza: '', google: '' } }
      const box = document.getElementById('keysInput')
      if (box) box.value = (apiKeys.polza || apiKeys.google) ? JSON.stringify(apiKeys, null, 2) : ''
      updateKeysStatus()
    }

    // Имя ключа принимаем в любом привычном написании — и короткое, и такое же, как
    // в переменных окружения сервера, чтобы можно было вставить что под рукой.
    function pickKey(obj, names) {
      for (const name of names) {
        const found = Object.keys(obj).find(k => k.toLowerCase().replace(/[-\s]/g, '_') === name)
        if (found && typeof obj[found] === 'string' && obj[found].trim()) return obj[found].trim()
      }
      return ''
    }

    function saveApiKeys() {
      const el = document.getElementById('keysStatus')
      const raw = document.getElementById('keysInput').value.trim()
      if (!raw) {
        apiKeys = { polza: '', google: '' }
        try { localStorage.removeItem(KEYS_STORAGE) } catch {}
        updateKeysStatus()
        return
      }
      let parsed
      try { parsed = JSON.parse(raw) } catch (e) {
        el.textContent = 'Это не JSON: ' + e.message
        return
      }
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        el.textContent = 'Ожидается объект вида {"polza": "...", "google": "..."}'
        return
      }
      apiKeys = {
        polza: pickKey(parsed, ['polza', 'polza_api_key', 'polzakey', 'polza_key']),
        google: pickKey(parsed, ['google', 'google_api_key', 'googlekey', 'google_key', 'gemini'])
      }
      try { localStorage.setItem(KEYS_STORAGE, JSON.stringify(apiKeys)) } catch {}
      updateKeysStatus()
    }

    function updateKeysStatus() {
      const el = document.getElementById('keysStatus')
      if (!el) return
      // Google-ключ здесь необязателен: распознавание речи идёт через сервер, где ключ
      // уже прописан. В браузере нужен только Polza — им оплачиваются и фото, и ответы.
      el.textContent = apiKeys.polza ? 'Ключ Polza сохранён' : 'Нет ключа Polza'
    }

    window.addEventListener('load', () => {
      document.getElementById('settingsModal').classList.add('open')
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js')
      updateNotifBtn()
      loadApiKeys()
      // Эталон чистого экрана: с него начинается любой предмет, открытый впервые.
      pristineView = captureSubjectView()
    })


    function updateNotifBtn() {
      const btn = document.getElementById('notifBtn')
      if (!('Notification' in window)) { btn.parentElement.style.display = 'none'; return }
      if (Notification.permission === 'granted') {
        btn.textContent = 'Вкл'; btn.style.background = '#E8F5E9'; btn.style.color = '#2E7D32'; btn.disabled = true
      } else if (Notification.permission === 'denied') {
        btn.textContent = 'Заблокировано'; btn.style.background = '#FFE0E0'; btn.style.color = '#FF453A'; btn.disabled = true
      } else {
        btn.textContent = 'Вкл'; btn.style.background = '#F0EDFF'; btn.style.color = '#7B61FF'; btn.disabled = false
      }
    }

    function requestNotifPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(updateNotifBtn)
      }
    }

    // Часы Hoco Y1 рисуют пустой квадрат вместо большинства математических знаков.
    // Проверено на устройстве: греческий алфавит целиком, степени ¹ ² ³, знаки ± × ° ·
    // и дроби ½ ¼ ¾ выводятся нормально. Индексы, корни, суммы, интегралы, знаки
    // сравнения, стрелки, множества и остальные степени — нет.
    // Поэтому перед отправкой на часы переписываем непечатаемое обычными символами.
    const WATCH_CHAR_MAP = {
      '₀': '_0', '₁': '_1', '₂': '_2', '₃': '_3', '₄': '_4', '₅': '_5', '₆': '_6', '₇': '_7', '₈': '_8', '₉': '_9',
      'ₙ': '_n', 'ₓ': '_x', 'ᵢ': '_i', 'ⱼ': '_j', 'ₖ': '_k', 'ₐ': '_a', '₊': '_+', '₋': '_-',
      '⁰': '^0', '⁴': '^4', '⁵': '^5', '⁶': '^6', '⁷': '^7', '⁸': '^8', '⁹': '^9', 'ⁿ': '^n', '⁺': '^+', '⁻': '^-',
      '√': 'кр', '∛': 'куб.кр', '∑': 'сумма', '∏': 'произв', '∫': 'интеграл', '∂': 'd', '∇': 'набла',
      '≤': '<=', '≥': '>=', '≠': '!=', '≈': '~', '≡': '=', '≅': '~=', '∝': 'проп', '≪': '<<', '≫': '>>',
      '→': '->', '←': '<-', '↔': '<->', '⇒': '=>', '⇐': '<=', '⇔': '<=>', '↑': 'вверх', '↓': 'вниз', '⇌': '<->',
      '∈': ' прин ', '∉': ' не прин ', '⊂': ' подмн ', '⊃': ' надмн ', '∪': ' U ', '∩': ' пересеч ',
      '∅': 'пусто', '∞': 'беск', '∀': 'для любого ', '∃': 'существует ', '¬': 'не ', '∧': ' и ', '∨': ' или ',
      'ℕ': 'N', 'ℤ': 'Z', 'ℝ': 'R', 'ℂ': 'C', 'ℚ': 'Q',
      '⅓': '1/3', '⅔': '2/3', '⅕': '1/5', '⅖': '2/5', '⅗': '3/5', '⅘': '4/5', '⅙': '1/6', '⅚': '5/6',
      '⅐': '1/7', '⅛': '1/8', '⅜': '3/8', '⅝': '5/8', '⅞': '7/8', '⅑': '1/9', '⅒': '1/10',
      '∠': 'угол ', '⊥': ' перп ', '∥': ' парал ', 'ℏ': 'h', 'ℓ': 'l', '∆': 'дельта', '∡': 'угол ',
      '−': '-', '–': '-', '—': '-', '⋅': '·', '∙': '·', '•': '·', '÷': ':', '∘': '°',
      '′': "'", '″': '"', '…': '...', ' ': ' ', ' ': ' ', ' ': ' '
    }
    // Всё, что часы точно умеют: латиница, кириллица, греческий, цифры, обычная
    // пунктуация и проверенные на устройстве символы. Остальное выкидываем — пустой
    // квадрат в ответе хуже, чем его отсутствие.
    const WATCH_SAFE_RE = /[A-Za-zͰ-ϿЀ-ӿ0-9\s.,:;!?()\[\]{}<>+\-*\/=%'"«»№#&@_|\\~^$±×½¼¾°·¹²³]/

    function toWatchText(text) {
      let out = ''
      for (const ch of text) {
        const mapped = WATCH_CHAR_MAP[ch]
        if (mapped !== undefined) { out += mapped; continue }
        if (WATCH_SAFE_RE.test(ch)) { out += ch; continue }
        // Математический алфавит (𝑥, 𝐀, 𝟏) приводим к обычным буквам и цифрам:
        // иначе из выражения молча пропадают все переменные.
        const code = ch.codePointAt(0)
        if (code >= 0x1D400 && code <= 0x1D7FF) {
          const plain = ch.normalize('NFKD')
          if (WATCH_SAFE_RE.test(plain)) out += plain
        }
      }
      return out.replace(/ {2,}/g, ' ')
    }

    function browserNotify(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return
      // Звёздочку умножения переводим в · ДО вырезания markdown: иначе следующая строка
      // съедала её вместе с разметкой, и на часы приходило «0,3 0,02» вместо «0,3 · 0,02».
      // Точка-оператор часами поддерживается и заодно привычнее в записи от руки.
      // Умножение отличаем от markdown по симметрии пробелов: у «5 * 3» и «m*a» они
      // одинаковые с обеих сторон, а у курсива «*слово*» — нет. Просмотр вперёд (?=)
      // не съедает следующий символ, иначе в цепочке «a * b * c» терялась средняя звёздочка.
      const withMul = body
        .replace(/([\d)a-zA-Zа-яА-Я]) \* (?=[\d(a-zA-Zа-яА-Я])/g, '$1 · ')
        .replace(/([\d)a-zA-Zа-яА-Я])\*(?=[\d(a-zA-Zа-яА-Я])/g, '$1·')
      let text = toWatchText(withMul.replace(/\*\*/g, '').replace(/\*/g, '').replace(/#{1,6}\s/g, '').trim())
      const CHUNK = 200
      const chunks = []
      while (text.length > 0) {
        let end = Math.min(CHUNK, text.length)
        if (end < text.length) {
          const ln = text.lastIndexOf('\n', end)
          const ls = text.lastIndexOf(' ', end)
          end = ln > 0 ? ln : ls > 0 ? ls : end
        }
        chunks.push(text.substring(0, end).trim())
        text = text.substring(end).trim()
      }
      chunks.forEach((chunk, i) => {
        setTimeout(() => {
          try { new Notification(title, { body: chunk, silent: i > 0 }) } catch {}
        }, i * 500)
      })
    }

    // Единая точка обращения к Polza — раньше этим занимался server.ts.
    async function callPolza(body, timeoutMs) {
      if (!apiKeys.polza) return { ok: false, error: 'Не задан ключ Polza — открой настройки' }
      const ctrl = new AbortController()
      const timer = setTimeout(() => ctrl.abort(), timeoutMs)
      try {
        const res = await fetch('https://polza.ai/api/v1/chat/completions', {
          method: 'POST',
          signal: ctrl.signal,
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKeys.polza },
          body: JSON.stringify(body)
        })
        clearTimeout(timer)
        const raw = await res.text()
        let data
        try { data = JSON.parse(raw) } catch { return { ok: false, error: 'Не JSON: ' + raw.substring(0, 200) } }
        if (!res.ok) return { ok: false, error: 'HTTP ' + res.status + (data?.error?.message ? ': ' + data.error.message : '') }
        const answer = data.choices?.[0]?.message?.content || ''
        if (!answer.trim()) return { ok: false, error: 'Пустой ответ. Finish: ' + (data.choices?.[0]?.finish_reason || '?') }
        return { ok: true, answer, usage: data.usage ?? null, cost: data.cost ?? data.price ?? null }
      } catch (e) {
        clearTimeout(timer)
        return { ok: false, error: e.name === 'AbortError' ? 'Превышено время ожидания' : e.message }
      }
    }

    let geoBoard = null

    function renderFigure(figJson) {
      const el = document.getElementById('geoBoard')
      if (!figJson) { el.style.display = 'none'; return }
      try {
        const fig = typeof figJson === 'string' ? JSON.parse(figJson) : figJson
        el.style.display = 'block'
        el.innerHTML = ''
        el.id = 'geoBoard'
        if (geoBoard) { try { JXG.JSXGraph.freeBoard(geoBoard) } catch {} }

        // Вычислим bounding box по точкам
        const pts = Object.values(fig.points || {})
        const circles = fig.circles || []
        let xs = pts.map(p => p[0])
        let ys = pts.map(p => p[1])
        circles.forEach(c => {
          const cp = fig.points[c.center] || [0,0]
          xs.push(cp[0]-c.radius, cp[0]+c.radius)
          ys.push(cp[1]-c.radius, cp[1]+c.radius)
        })
        if (!xs.length) { xs = [-5,5]; ys = [-5,5] }
        const pad = 1.5
        const minX = Math.min(...xs)-pad, maxX = Math.max(...xs)+pad
        const minY = Math.min(...ys)-pad, maxY = Math.max(...ys)+pad

        geoBoard = JXG.JSXGraph.initBoard('geoBoard', {
          boundingbox: [minX, maxY, maxX, minY],
          axis: false, grid: false, showNavigation: false, showCopyright: false,
          pan: { enabled: false }, zoom: { enabled: false }
        })

        // Точки
        const jxPts = {}
        for (const [name, coord] of Object.entries(fig.points || {})) {
          jxPts[name] = geoBoard.create('point', coord, {
            name, size: 3, fixed: true,
            label: { fontSize: 14, fontWeight: 'bold', color: '#111' },
            color: '#7B61FF', strokeColor: '#7B61FF', fillColor: '#7B61FF'
          })
        }

        // Видимые отрезки
        for (const seg of (fig.segments || [])) {
          const [a, b] = seg
          if (jxPts[a] && jxPts[b]) {
            geoBoard.create('segment', [jxPts[a], jxPts[b]], {
              strokeColor: '#222', strokeWidth: 2
            })
          }
        }

        // Скрытые рёбра (пунктир)
        for (const seg of (fig.hidden_segments || [])) {
          const [a, b] = seg
          if (jxPts[a] && jxPts[b]) {
            geoBoard.create('segment', [jxPts[a], jxPts[b]], {
              strokeColor: '#888', strokeWidth: 1.5, dash: 2
            })
          }
        }

        // Окружности
        for (const c of circles) {
          const cp = jxPts[c.center]
          if (cp) {
            geoBoard.create('circle', [cp, c.radius], {
              strokeColor: '#7B61FF', strokeWidth: 2, fillColor: 'none'
            })
          }
        }

      } catch(e) {
        document.getElementById('geoBoard').style.display = 'none'
      }
    }

    function parseAndRenderGeometry(rawAnswer) {
      const match = rawAnswer.match(/FIGURE_JSON:(\{[\s\S]*\})\s*$/)
      if (!match) { renderFigure(null); return rawAnswer }
      try {
        const fig = JSON.parse(match[1])
        renderFigure(fig)
      } catch { renderFigure(null) }
      return rawAnswer.replace(/FIGURE_JSON:[\s\S]*$/, '').trim()
    }

          // Предзапись: держим последние отброшенные пакеты тишины и отдаём их первыми,
          // когда началась речь. Иначе тихий заход в фразу («а вот скажите...») падал
          // ниже порога и первое слово просто не доезжало до распознавания.
          this.preroll = []
          this.prerollMax = 4
        }
        emit(pcm) {
          const int16 = new Int16Array(pcm.length)
          for (let i = 0; i < pcm.length; i++) int16[i] = Math.round(pcm[i] * 32767)
          this.port.postMessage(int16.buffer, [int16.buffer])
        }
        process(inputs) {
          const channel = inputs[0] && inputs[0][0]
          if (!channel) return true
          for (let i = 0; i < channel.length; i++) this.buffer.push(channel[i])
          while (this.readPos + 1 < this.buffer.length) {
            const idx = Math.floor(this.readPos)
            const frac = this.readPos - idx
            const sample = this.buffer[idx] + (this.buffer[idx + 1] - this.buffer[idx]) * frac
            this.outBuf.push(Math.max(-1, Math.min(1, sample)))
            this.readPos += this.ratio
          }
          const consumed = Math.floor(this.readPos)
          if (consumed > 0) { this.buffer = this.buffer.slice(consumed); this.readPos -= consumed }
          if (this.outBuf.length >= this.chunkSize) {
            const pcm = this.outBuf.splice(0, this.outBuf.length)
            if (this.gate) {
              let sum = 0
              for (let i = 0; i < pcm.length; i++) sum += pcm[i] * pcm[i]
              const rms = Math.sqrt(sum / pcm.length)
              // Фон отслеживаем асимметрично: вниз быстро, вверх очень медленно, иначе
              // сама речь подтянет порог за собой и учитель окажется "тишиной".
              // Коэффициенты привязаны к длине пакета (32мс): постоянные времени те же
              // ~1.3с вниз и ~26с вверх, что и при прежних 128мс.
              this.noiseFloor = rms < this.noiseFloor
                ? this.noiseFloor * 0.975 + rms * 0.025
                : this.noiseFloor * 0.99875 + rms * 0.00125
              if (rms > Math.max(0.002, this.noiseFloor * 2)) this.lastVoiceTime = currentTime
              if (currentTime - this.lastVoiceTime > this.hangover) {
                this.preroll.push(pcm)
                if (this.preroll.length > this.prerollMax) this.preroll.shift()
                return true
              }
              while (this.preroll.length) this.emit(this.preroll.shift())
            }
            this.emit(pcm)
          }
          return true
        }
      }
      registerProcessor('pcm-processor', PCMProcessor)
    `

    let continuousActive = false
    // Вкладка свёрнута: режим не выключен, но микрофон и сокет временно погашены.
    // Отдельный флаг нужен, чтобы реконнект не поднимал соединение в фоне.
    let voicePaused = false
    let voiceStarting = false
    // Номер попытки запуска: каждый stop/старт/восстановление увеличивает его, и любая
    // асинхронная цепочка, начатая раньше, по несовпадению номера тихо сворачивается.
    let voiceSession = 0
    let voiceStream = null
    let voiceWakeLock = null
    let audioContext = null
    let workletNode = null
    let lastVoiceAnswer = ''

    // Сокет к нашему ретранслятору распознавания и его переподключение.
    let relaySocket = null
    let relayReconnectTimer = null
    let relayFails = 0
    // Причина последнего обрыва со стороны Google — показываем её пользователю.
    let lastCloseInfo = ''
    // Склейка кусков расшифровки и очередь фраз на ответ.
    let lastTranscript = ''
    let pendingTranscript = ''
    let transcriptTimer = null
    let pendingPhrases = []
    let answering = false
    // Короткая память диалога на урок: переживает пересоздание сессии Google, нужна для
    // уточняющих вопросов вроде "а почему?".
    let conversationHistory = []

    function setVoiceUiListening(on) {
      document.getElementById('voiceBtnText').textContent = on ? 'Слушаю...' : 'Голосовой ввод'
      document.getElementById('voiceBtn').style.background = on ? '#C62828' : '#E8F5E9'
      document.getElementById('voiceBtn').style.color = on ? '#fff' : '#2E7D32'
      document.getElementById('voiceCancelBtn').style.display = on ? 'block' : 'none'
      const recognizedEl = document.getElementById('voiceRecognizedText')
      recognizedEl.style.display = on ? 'block' : 'none'
      if (!on) recognizedEl.textContent = ''
    }

    function showVoiceStatus(status) {
      document.getElementById('voiceRecognizedText').textContent = status
    }

    async function acquireVoiceWakeLock() {
      try { voiceWakeLock = await navigator.wakeLock.request('screen') } catch {}
    }

    function releaseVoiceWakeLock() {
      if (voiceWakeLock) { try { voiceWakeLock.release() } catch {}; voiceWakeLock = null }
    }

    async function pickMicDeviceId() {
      const devices = await navigator.mediaDevices.enumerateDevices()
      const mics = devices.filter(d => d.kind === 'audioinput')
      const micSelect = document.getElementById('micSelect')
      const micRow = document.getElementById('micRow')
      if (mics.length > 1) {
        micSelect.innerHTML = mics.map(m => `<option value="${m.deviceId}">${(m.label || 'Микрофон').replace(/</g, '&lt;')}</option>`).join('')
        let saved = null
        try { saved = localStorage.getItem(MIC_STORAGE_KEY) } catch {}
        if (saved && mics.some(m => m.deviceId === saved)) micSelect.value = saved
        micRow.style.display = 'flex'
        return micSelect.value
      }
      micRow.style.display = 'none'
      return mics[0]?.deviceId || null
    }

    function onMicChange(deviceId) {
      try { localStorage.setItem(MIC_STORAGE_KEY, deviceId) } catch {}
      if (continuousActive) { stopContinuousVoice(); startContinuousVoice() }
    }

    async function toggleVoice() {
      if (continuousActive) { stopContinuousVoice(); return }
      await startContinuousVoice()
    }

    function cancelVoice() {
      stopContinuousVoice()
    }

    function giveUpContinuousVoice(reason) {
      stopContinuousVoice()
      document.getElementById('voiceBtnText').textContent = 'Нажмите, чтобы продолжить'
      document.getElementById('voiceBtn').style.background = '#FFF3E0'
      document.getElementById('voiceBtn').style.color = '#F57C00'
      // Причину показываем ПОСЛЕ остановки: setVoiceUiListening(false) прячет и чистит
      // строку статуса, поэтому написанное до вызова тут же пропадало.
      if (reason) {
        const el = document.getElementById('voiceRecognizedText')
        el.style.display = 'block'
        el.textContent = reason
      }
    }

    function arrayBufferToBase64(buffer) {
      let binary = ''
      const bytes = new Uint8Array(buffer)
      const chunkSize = 0x8000
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize))
      }
      return btoa(binary)
    }

    function finalizeVoiceAnswer(answer, heard, ms) {
      // Сравниваем с последним ГОЛОСОВЫМ ответом, а не с общим lastAnswer: тот пишется ещё
      // и разбором фото, и совпадение с ним молча съедало корректный ответ по речи.
      if (answer === lastVoiceAnswer) { showVoiceStatus('Такой же ответ, как только что — пропускаю'); return }
      // Время самого запроса к модели — чтобы было видно, где именно уходит задержка.
      showVoiceStatus((ms ? 'Отвечено за ' + (ms / 1000).toFixed(1) + ' с: ' : 'Отвечено: ') + answer)
      lastVoiceAnswer = answer
      lastAnswer = answer
      hide('errorCard')
      hide('resultCard')
      hide('resultHeader')
      const list = document.getElementById('tasksList')
      const card = document.createElement('div')
      card.className = 'task-card'
      // Показываем и распознанную фразу: в потоке карточек иначе не понять,
      // на какой вопрос это ответ.
      const heardLine = heard
        ? `<div style="font-size:12px;color:#999;margin-bottom:6px;word-break:break-word;line-height:1.35">${heard.replace(/</g, '&lt;')}</div>`
        : ''
      card.innerHTML = heardLine + `<div class="task-text">${answer.replace(/</g, '&lt;')}</div>`
      list.insertBefore(card, list.firstChild)
      list.style.display = 'flex'
      browserNotify('Tutor', answer)
    }

    // ===== Ответ на распознанную фразу =====

    async function handleFinalTranscript(text) {
      if (!continuousActive || text === lastTranscript) return
      lastTranscript = text
      const historyBlock = conversationHistory.length
        ? 'Контекст предыдущих вопросов и ответов на этом уроке (используй, если текущая фраза — уточнение вроде "а почему?", "а что дальше?"):\n' +
          conversationHistory.map((h, i) => `${i + 1}. Вопрос: ${h.q}\n   Ответ: ${h.a}`).join('\n') + '\n\n'
        : ''
      const startedAt = Date.now()
      const result = await callPolza({
        // Замеры на живом ключе, один и тот же промпт, медиана из трёх прогонов:
        //   gemini-3.7-flash      7010 мс (разброс 2450–9599), 42 токена мыслей
        //   gemini-3.6-flash      1298 мс, 0 мыслей
        //   gemini-3.1-flash-lite 1442 мс, 0 мыслей, 12/12 верных решений
        //   gemini-3.5-flash-lite 1105 мс, 0 мыслей, 12/12 верных решений  <- выбрана
        // «Reasoning is mandatory» — ограничение конкретно 3.7-flash: остальные модели
        // принимают minimal и не тратят на мысли ни одного токена.
        // Для разбора фото модель НЕ менять: там нужна сильная, а не быстрая.
        model: 'google/gemini-3.5-flash-lite',
        max_tokens: 300,
        temperature: 0.1,
        provider: { only: ['Google AI Studio'], allow_fallbacks: false },
        reasoning: { effort: 'minimal' },
        include_reasoning: false,
        messages: [{ role: 'user', content: [{ type: 'text', text: VOICE_ANSWER_PROMPT_PREFIX + historyBlock + 'Текущая фраза: ' + text }] }]
      }, 20000)
      const tookMs = Date.now() - startedAt
      if (!result.ok || !result.answer) { showVoiceStatus('Ошибка: ' + (result.error || 'пустой ответ')); return }
      const answer = result.answer.trim()
      // Строгое сравнение с 'SKIP' пропускало «SKIP.» и «SKIP — бытовая фраза» прямо
      // на экран как ответ. Смотрим на начало строки, игнорируя обрамление.
      if (!answer || /^[\s"'«»*_>-]*SKIP\b/i.test(answer)) {
        showVoiceStatus('Не вопрос: "' + text + '" — слушаю дальше')
        return
      }
      conversationHistory.push({ q: text, a: answer })
      if (conversationHistory.length > HISTORY_MAX) conversationHistory.shift()
      finalizeVoiceAnswer(answer, text, tookMs)
    }

    function enqueuePhrase(text) {
      pendingPhrases.push({ text, at: Date.now() })
      // Если модель отстаёт от речи, копить бессмысленно — оставляем самые свежие фразы.
      while (pendingPhrases.length > MAX_PENDING_PHRASES) pendingPhrases.shift()
      drainPhrases()
    }

    async function drainPhrases() {
      if (answering) return
      answering = true
      try {
        while (continuousActive) {
          const item = pendingPhrases.shift()
          if (!item) break
          if (Date.now() - item.at > PHRASE_STALE_MS) continue
          try { await handleFinalTranscript(item.text) } catch { /* одна фраза не должна ронять очередь */ }
        }
      } finally {
        answering = false
      }
    }

    function queueFinalTranscript(text) {
      pendingTranscript = pendingTranscript ? pendingTranscript + ' ' + text : text
      if (transcriptTimer !== null) clearTimeout(transcriptTimer)
      transcriptTimer = setTimeout(() => {
        const combined = pendingTranscript.trim()
        pendingTranscript = ''
        transcriptTimer = null
        if (combined) enqueuePhrase(combined)
      }, TRANSCRIPT_GAP_MS)
    }

    // ===== Живая сессия распознавания =====
    // Звук идёт не прямо в Google, а через наш сервер: Google отклоняет обращения к Gemini
    // API из региона пользователя («User location is not supported for the API use»), и из
    // браузера напрямую сессия не поднимается вообще. Сервер пересылает звук своим IP
    // и возвращает распознанный текст. Ответ на вопрос при этом по-прежнему берётся из
    // браузера напрямую у Polza — она из России доступна, и лишний хоп там стоил бы секунду.
    const VOICE_RELAY = 'https://hungry-camel-14.zigzaktm.deno.net'

    function closeRelaySocket() {
      if (!relaySocket) return
      const ws = relaySocket
      relaySocket = null
      try { ws.onclose = null; ws.onmessage = null; ws.onerror = null; ws.onopen = null; ws.close() } catch {}
    }

    function scheduleRelayReconnect() {
      if (relayReconnectTimer !== null) return
      relayFails++
      if (relayFails > RELAY_MAX_FAILS) {
        giveUpContinuousVoice('Распознавание недоступно' + lastCloseInfo + ' — проверь интернет')
        return
      }
      showVoiceStatus('Связь потеряна' + lastCloseInfo + ', восстанавливаю...')
      const delay = Math.min(RELAY_RECONNECT_BASE_MS * 2 ** (relayFails - 1), RELAY_RECONNECT_MAX_MS)
      relayReconnectTimer = setTimeout(() => {
        relayReconnectTimer = null
        if (continuousActive && !voicePaused) connectRelay(true)
      }, delay)
    }

    function connectRelay(afterFailure) {
      const ws = new WebSocket(VOICE_RELAY.replace(/^http/, 'ws') + '/live-voice')
      ws.onopen = () => {
        if (ws !== relaySocket) return
        relayFails = 0
        if (afterFailure) showVoiceStatus('Связь восстановлена, слушаю')
      }
      ws.onmessage = (e) => {
        let msg
        try { msg = JSON.parse(e.data) } catch { return }
        if (msg.type === 'final' && msg.text) queueFinalTranscript(msg.text)
        else if (msg.type === 'interim' && msg.text) showVoiceStatus('Слышу: ' + msg.text)
        else if (msg.type === 'status' && msg.text) showVoiceStatus(msg.text)
        else if (msg.type === 'error') showVoiceStatus('Ошибка: ' + msg.error)
      }
      ws.onerror = () => {}
      ws.onclose = (e) => {
        lastCloseInfo = e && e.code && e.code !== 1000 ? ' (' + e.code + ')' : ''
        // Закрытие уже заменённого сокета игнорируем — иначе поверх живого соединения
        // поднимется второе, а ссылка на него потеряется.
        if (ws !== relaySocket) return
        relaySocket = null
        if (!continuousActive || voicePaused) return
        scheduleRelayReconnect()
      }
      relaySocket = ws
    }

    function startLiveSession() {
      relayFails = 0
      lastTranscript = ''
      pendingTranscript = ''
      pendingPhrases = []
      connectRelay(false)
    }

    function teardownLiveSession() {
      if (relayReconnectTimer !== null) { clearTimeout(relayReconnectTimer); relayReconnectTimer = null }
      if (transcriptTimer !== null) { clearTimeout(transcriptTimer); transcriptTimer = null }
      closeRelaySocket()
      pendingTranscript = ''
      pendingPhrases = []
    }

    // Полная разборка аудио-тракта: воркл, контекст, треки микрофона, вейклок.
    function teardownAudio() {
      if (workletNode) { try { workletNode.port.onmessage = null; workletNode.disconnect() } catch {}; workletNode = null }
      if (audioContext) { try { audioContext.close() } catch {}; audioContext = null }
      if (voiceStream) { voiceStream.getTracks().forEach(t => t.stop()); voiceStream = null }
      releaseVoiceWakeLock()
    }

    // Сворачивание своей же попытки запуска. Если глобальные voiceStream/audioContext
    // уже перехватила следующая попытка — трогаем только собственный поток, иначе
    // погасили бы живой микрофон вместо своего.
    function abortVoiceSetup(stream) {
      if (!stream || voiceStream === stream) { teardownAudio(); return }
      stream.getTracks().forEach(t => t.stop())
    }

    async function setupAudioPipeline(stream) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)()
      // Контекст создаётся уже после await getUserMedia, то есть вне синхронного стека
      // пользовательского жеста — Safari/iOS стартует его в suspended, и в воркл не
      // приходит ни одного сэмпла: режим «слушает» молча и навсегда.
      if (audioContext.state === 'suspended') { try { await audioContext.resume() } catch {} }
      const workletUrl = URL.createObjectURL(new Blob([PCM_WORKLET_CODE], { type: 'application/javascript' }))
      // Модуль уже загружен — blob-URL больше не нужен, иначе он копится на каждый рестарт.
      try { await audioContext.audioWorklet.addModule(workletUrl) } finally { URL.revokeObjectURL(workletUrl) }
      const source = audioContext.createMediaStreamSource(stream)
      // Ограничиваем полосу до речевой ДО того, как воркл проредит 48кГц в 16кГц.
      // Прореживание там простое, без фильтра, поэтому всё выше 8кГц заворачивалось
      // обратно в речевой диапазон широкополосным шипением (алиасинг) — распознавание
      // разбирало речь сквозь него. Заодно срезаем гул ниже 80Гц: шаги, стулья, стол.
      const highpass = audioContext.createBiquadFilter()
      highpass.type = 'highpass'
      highpass.frequency.value = 80
      const lowpass = audioContext.createBiquadFilter()
      lowpass.type = 'lowpass'
      lowpass.frequency.value = 7000
      workletNode = new AudioWorkletNode(audioContext, 'pcm-processor')
      workletNode.port.onmessage = (e) => {
        if (!relaySocket || relaySocket.readyState !== WebSocket.OPEN) return
        const base64 = arrayBufferToBase64(e.data)
        relaySocket.send(JSON.stringify({ realtimeInput: { audio: { data: base64, mimeType: 'audio/pcm;rate=16000' } } }))
      }
      // Тихий гейн вместо прямого коннекта к destination — держит граф "живым" для
      // AudioWorklet, но не даёт микрофону слышаться из динамика (эхо).
      const silentGain = audioContext.createGain()
      silentGain.gain.value = 0
      source.connect(highpass)
      highpass.connect(lowpass)
      lowpass.connect(workletNode)
      workletNode.connect(silentGain)
      silentGain.connect(audioContext.destination)
    }

    async function startContinuousVoice() {
      // Флаг continuousActive поднимается только в самом конце, поэтому без отдельной
      // защиты второй клик по кнопке успевал запустить второй микрофонный поток поверх
      // первого — первый терялся и горел до перезагрузки страницы.
      if (continuousActive || voiceStarting) return
      // Ключ Google браузеру больше не нужен — распознавание идёт через сервер, ключ
      // лежит в его переменных окружения. Здесь нужен только Polza, для ответов.
      if (!apiKeys.polza) {
        alert('Сначала укажи ключ Polza в настройках — без него не будет ответов')
        document.getElementById('settingsModal').classList.add('open')
        return
      }
      voiceStarting = true
      const session = ++voiceSession
      try {
        let deviceId = null
        try {
          const probe = await navigator.mediaDevices.getUserMedia({ audio: true })
          probe.getTracks().forEach(t => t.stop())
          deviceId = await pickMicDeviceId()
        } catch (e) {
          alert('Нет доступа к микрофону')
          setVoiceUiListening(false)
          return
        }
        if (session !== voiceSession) return
        let stream = null
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: micConstraints(deviceId) })
          // Пока ждали разрешение, режим могли остановить — поток гасим сразу.
          if (session !== voiceSession) { stream.getTracks().forEach(t => t.stop()); return }
          voiceStream = stream
          await setupAudioPipeline(stream)
          if (session !== voiceSession) { abortVoiceSetup(stream); return }
        } catch (e) {
          // Поток мог открыться и упасть уже на сборке пайплайна — гасим всё,
          // иначе микрофон остаётся включённым.
          abortVoiceSetup(stream)
          // Остановка во время запуска роняет сборку пайплайна на закрытом контексте —
          // это не отказ в доступе, молчим.
          if (session !== voiceSession) return
          alert('Нет доступа к микрофону')
          setVoiceUiListening(false)
          return
        }
        continuousActive = true
        voicePaused = false
        lastVoiceAnswer = ''
        conversationHistory = []
        document.getElementById('tasksList').innerHTML = ''
        setVoiceUiListening(true)
        acquireVoiceWakeLock()
        startLiveSession()
      } finally {
        voiceStarting = false
      }
    }

    function stopContinuousVoice() {
      // Сдвигаем номер сессии: запуск или восстановление, зависшие на await, увидят
      // несовпадение и не поднимут микрофон уже после остановки.
      voiceSession++
      continuousActive = false
      voicePaused = false
      setVoiceUiListening(false)
      teardownLiveSession()
      teardownAudio()
    }

    document.addEventListener('visibilitychange', () => {
      if (!continuousActive) return
      if (document.visibilityState === 'hidden') {
        if (voicePaused) return
        // Пауза, а не остановка: teardownLiveSession снимает обработчики, поэтому
        // реконнект не поднимет сессию в фоне, где аудио всё равно некому отправлять.
        voicePaused = true
        voiceSession++
        teardownLiveSession()
        teardownAudio()
      } else if (document.visibilityState === 'visible') {
        if (!voicePaused) return
        voicePaused = false
        const session = ++voiceSession
        let savedMic = null
        try { savedMic = localStorage.getItem(MIC_STORAGE_KEY) } catch {}
        navigator.mediaDevices.getUserMedia({ audio: micConstraints(savedMic) }).then(async stream => {
          if (session !== voiceSession) { stream.getTracks().forEach(t => t.stop()); return }
          voiceStream = stream
          await setupAudioPipeline(stream)
          if (session !== voiceSession) { abortVoiceSetup(stream); return }
          acquireVoiceWakeLock()
          startLiveSession()
        }).catch(() => {
          if (session !== voiceSession) return
          giveUpContinuousVoice()
        })
      }
    })

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const img = new Image()
        img.onload = () => {
          const MAX = 1600
          let w = img.width, h = img.height
          if (w > MAX || h > MAX) {
            if (w > h) { h = Math.round(h * MAX / w); w = MAX }
            else { w = Math.round(w * MAX / h); h = MAX }
          }
          const c = document.createElement('canvas')
          c.width = w; c.height = h
          c.getContext('2d').drawImage(img, 0, 0, w, h)
          resolve(c.toDataURL('image/jpeg', 0.80).split(',')[1])
        }
        img.onerror = () => reject(new Error('Не удалось прочитать файл'))
        img.src = URL.createObjectURL(file)
      })
    }

    function show(id)  { document.getElementById(id).style.display = 'flex' }
    function hide(id)  { document.getElementById(id).style.display = 'none' }
    function block(id) { document.getElementById(id).style.display = 'block' }
    function setText(id, text) { document.getElementById(id).textContent = text }

    let lastAnswer = ''
    let lastTasks = []
    let lastPhotoUrl = null
    let timerInterval = null
    let sendQueue = null

    function startTimer() {}
    function stopTimer() {}

    function splitTasks(text) {
      const countMatch = text.match(/TASKS:(\d+)/)
      const clean = text.replace(/TASKS:\d+/, '').trim().replace(/\r\n/g, '\n')
      const parts = clean.split(/\n[ \t]*\n+/).map(p => p.trim()).filter(Boolean)
      if (countMatch) {
        const n = parseInt(countMatch[1])
        if (parts.length === n) return parts
        const numbered = clean.split(/^(?=\d{1,2}[.) ])/m).map(p => p.trim()).filter(Boolean)
        if (numbered.length === n) return numbered
        return parts.length > 1 ? parts : [clean]
      }
      if (parts.length > 1) return parts
      const numbered = clean.split(/^(?=\d{1,2}[.) ])/m).map(p => p.trim()).filter(Boolean)
      return numbered.length > 1 ? numbered : [clean]
    }

    // Результаты живут отдельно для каждого предмета. Область ответа одна на всё
    // приложение, поэтому при переключении снимаем её состояние для старого предмета
    // и возвращаем сохранённое для нового — разбор алгебры больше не пропадает
    // из-за того, что следом сфотографировали геометрию.
    const SUBJECT_VIEW_NODES = [
      ['tasksList', true], ['taskBtnsBar', true], ['resultCard', true], ['errorCard', true],
      ['tasksHeader', false], ['resultHeader', false], ['resultResendBtn', false],
      ['shootBtn', false], ['galleryBtn', false], ['againBtn', false], ['galleryBtn2', false], ['savePhotoBtn', false]
    ]
    const subjectViews = {}
    let pristineView = null

    function captureSubjectView() {
      const nodes = {}
      SUBJECT_VIEW_NODES.forEach(([id, withHtml]) => {
        const el = document.getElementById(id)
        if (el) nodes[id] = { display: el.style.display, html: withHtml ? el.innerHTML : null }
      })
      return {
        nodes, answer: lastAnswer, voiceAnswer: lastVoiceAnswer,
        tasks: lastTasks.slice(), nextIdx: nextTaskIdx, photoUrl: lastPhotoUrl, files: lastFiles
      }
    }

    function restoreSubjectView(snap) {
      if (!snap) return
      SUBJECT_VIEW_NODES.forEach(([id, withHtml]) => {
        const el = document.getElementById(id)
        const saved = snap.nodes[id]
        if (!el || !saved) return
        if (withHtml && saved.html !== null) el.innerHTML = saved.html
        el.style.display = saved.display
      })
      lastAnswer = snap.answer
      lastVoiceAnswer = snap.voiceAnswer
      lastTasks = snap.tasks.slice()
      nextTaskIdx = snap.nextIdx
      lastPhotoUrl = snap.photoUrl
      lastFiles = snap.files
      // Кнопки задач создаются кодом, а не разметкой, поэтому обработчики на них
      // не переживают восстановление html — вешаем заново.
      lastTasks.forEach((task, i) => {
        const btn = document.getElementById('task-btn-' + i)
        if (btn) btn.onclick = () => sendTask(i, lastTasks.length)
      })
    }

    function switchSubject(value) {
      if (value === currentSubject) return
      // Очередь автоотправки принадлежала прежнему предмету: её задачи уже заменены
      // в lastTasks, и продолжение слало бы на часы чужие ответы.
      if (sendQueue) clearTimeout(sendQueue)
      autoSendCancel = null
      subjectViews[currentSubject] = captureSubjectView()
      currentSubject = value
      restoreSubjectView(subjectViews[value] || pristineView)
      updateVoiceBtn()
      autoModelForSubject()
    }

    function renderTasks(tasks) {
      const list = document.getElementById('tasksList')
      const header = document.getElementById('tasksHeader')
      const bar = document.getElementById('taskBtnsBar')
      list.innerHTML = ''
      bar.innerHTML = ''
      const total = tasks.length
      tasks.forEach((task, i) => {
        const card = document.createElement('div')
        card.className = 'task-card'
        card.innerHTML = `
          <div class="task-num">№${i + 1}</div>
          <div class="task-text">${task.replace(/</g, '&lt;')}</div>
        `
        list.appendChild(card)
        const btn = document.createElement('button')
        btn.id = `task-btn-${i}`
        btn.textContent = String(i + 1)
        btn.style.cssText = 'flex:1;height:40px;border:none;border-radius:10px;background:#F0EDFF;color:#7B61FF;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all 0.2s'
        btn.onclick = () => sendTask(i, total)
        bar.appendChild(btn)
      })
      header.style.display = total > 0 ? 'block' : 'none'
      list.style.display = 'flex'
    }

    async function sendTask(idx, total) {
      const task = lastTasks[idx]
      if (!task) return
      const btn = document.getElementById(`task-btn-${idx}`)
      const num = String(idx + 1)
      if (btn) { btn.textContent = '...'; btn.style.background = '#ddd' }
      try {
        browserNotify(`${idx + 1}/${total ?? lastTasks.length}`, task)
        if (btn) { btn.textContent = '✓'; btn.style.background = '#E8F5E9'; btn.style.color = '#2E7D32'; setTimeout(() => { btn.textContent = num; btn.style.background = '#F0EDFF'; btn.style.color = '#7B61FF' }, 2000) }
      } catch(e) {
        if (btn) { btn.textContent = '!'; btn.style.background = '#FFE0E0'; btn.style.color = '#FF453A'; setTimeout(() => { btn.textContent = num; btn.style.background = '#F0EDFF'; btn.style.color = '#7B61FF' }, 2000) }
      }
    }

    let autoSendCancel = null
    function autoSendAllTasks(tasks) {
      if (sendQueue) clearTimeout(sendQueue)
      const token = {}
      autoSendCancel = token
      const total = tasks.length
      let i = 0
      async function sendNext() {
        if (token !== autoSendCancel) return
        if (i >= total) return
        try { await sendTask(i, total) } catch(e) {}
        i++
        if (token !== autoSendCancel) return
        const delay = currentSubject === 'probability' ? 30000 : 60000
        if (i < total) sendQueue = setTimeout(sendNext, delay)
      }
      sendNext()
    }

    let lastFiles = []

    async function regenerate() {
      if (!lastFiles.length) return
      autoSendCancel = null
      if (sendQueue) clearTimeout(sendQueue)
      hide('resultCard'); hide('resultHeader'); document.getElementById('resultResendBtn').style.display = 'none'
      hide('errorCard')
      document.getElementById('tasksList').style.display = 'none'
      document.getElementById('tasksHeader').style.display = 'none'
      show('status')
      startTimer()
      try {
        const images = await Promise.all(lastFiles.map(toBase64))
        const data = await analyzePhotos(images)
        if (!data.ok || !data.answer) throw new Error(data.error || 'Пустой ответ')
        const displayAnswer = currentSubject === 'geometry' ? parseAndRenderGeometry(data.answer) : (renderFigure(null), data.answer)
        lastAnswer = displayAnswer
        lastTasks = splitTasks(displayAnswer)
        nextTaskIdx = 0
        stopTimer()
        hide('status')
        const usedModel = data.model || currentModel
        const singleSubjects = ['society', 'history', 'other']
        if (lastTasks.length > 1 && !singleSubjects.includes(currentSubject)) {
          hide('resultCard'); hide('resultHeader'); document.getElementById('resultResendBtn').style.display = 'none'
          renderTasks(lastTasks)
          autoSendAllTasks(lastTasks)
        } else {
          document.getElementById('tasksList').style.display = 'none'
          setText('resultText', displayAnswer)

          document.getElementById('resultHeader').style.display = 'block'
          document.getElementById('resultResendBtn').style.display = 'block'
          block('resultCard')
          browserNotify('Tutor', displayAnswer)
        }
        document.getElementById('savePhotoBtn').style.display = 'block'
      } catch(e) {
        stopTimer()
        hide('status')
        setText('errorText', e.message || 'Ошибка')
        block('errorCard')
      }
    }

    let lastTap = 0
    let nextTaskIdx = 0
    document.addEventListener('touchend', (e) => {
      const now = Date.now()
      if (now - lastTap < 300) {
        const singleMode = ['society', 'history', 'other'].includes(currentSubject)
        if (singleMode && lastAnswer) {
          resendToWatch()
        } else if (lastTasks.length > 0) {
          if (nextTaskIdx < lastTasks.length) {
            sendTask(nextTaskIdx, lastTasks.length)
            nextTaskIdx++
          } else {
            nextTaskIdx = 0
          }
        }
      }
      lastTap = now
    })

    async function resendToWatch() {
      if (!lastAnswer) return
      const btn = document.getElementById('resultResendBtn')
      btn.textContent = 'Отправляю...'
      btn.disabled = true
      try {
        browserNotify('Tutor', lastAnswer)
        btn.textContent = 'Отправлено!'
        setTimeout(() => { btn.textContent = 'Отправить'; btn.disabled = false }, 2000)
      } catch(e) {
        btn.textContent = 'Ошибка'; btn.disabled = false
      }
    }

    async function handlePhoto(input) {
      const files = Array.from(input.files)
      if (!files.length) return

      lastFiles = files
      lastPhotoUrl = URL.createObjectURL(files[0])

      hide('shootBtn')
      hide('galleryBtn')
      block('againBtn')
      block('galleryBtn2')
      hide('resultCard'); hide('resultHeader'); document.getElementById('resultResendBtn').style.display = 'none'
      hide('errorCard')
      document.getElementById('savePhotoBtn').style.display = 'block'

      show('status')
      startTimer()

      let wakeLock = null
      try { wakeLock = await navigator.wakeLock.request('screen') } catch {}

      const images = await Promise.all(files.map(toBase64))
      try {
        const data = await analyzePhotos(images)
        if (!data.ok || !data.answer) throw new Error(data.error || 'Пустой ответ')
        const displayAnswer = currentSubject === 'geometry' ? parseAndRenderGeometry(data.answer) : (renderFigure(null), data.answer)
        lastAnswer = displayAnswer
        lastTasks = splitTasks(displayAnswer)
        nextTaskIdx = 0
        stopTimer()
        hide('status')
        const usedModel = data.model || currentModel
        const singleSubjects2 = ['society', 'history', 'other']
        if (lastTasks.length > 1 && !singleSubjects2.includes(currentSubject)) {
          hide('resultCard'); hide('resultHeader'); document.getElementById('resultResendBtn').style.display = 'none'
          renderTasks(lastTasks)
          autoSendAllTasks(lastTasks)
        } else {
          document.getElementById('tasksList').style.display = 'none'
          setText('resultText', displayAnswer)

          document.getElementById('resultHeader').style.display = 'block'
          document.getElementById('resultResendBtn').style.display = 'block'
          document.getElementById('resultCost').textContent = ''
          block('resultCard')
          browserNotify('Tutor', displayAnswer)
        }
        document.getElementById('savePhotoBtn').style.display = 'block'
      } catch (e) {
        stopTimer()
        hide('status')
        setText('errorText', e.message || 'Не удалось подключиться к серверу')
        block('errorCard')
      }
      if (wakeLock) try { wakeLock.release() } catch {}
    }
  </script>
